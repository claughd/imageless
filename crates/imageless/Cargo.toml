[package]
name = "imageless"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description ="Materialize a Nix flake carried in OCI image layers into the container rootfs at create time"
# Both are symlinks to the repository root, so there is one README and one
# license text rather than two that drift, and `cargo package` dereferences
# them into real files at the tarball root.
#
# What actually ships the bytes is that these paths are now *entries in the
# package directory* — not this `readme` key, which only tells crates.io which
# file to render. Until they existed the manifest named no license file at all
# (`license.workspace` is an SPDX expression and carries no bytes), which is
# the whole reason the crate declared Apache-2.0 while shipping none of it.
readme = "README.md"
keywords = ["nix", "oci", "container", "runc", "flake"]
categories = ["virtualization", "development-tools", "os::linux-apis"]
# No `rust-version`. The only floor this repo can honestly claim is the one it
# tests, and it tests exactly one toolchain — the flake's. Declaring that as
# the minimum would lock out consumers the code may well support; researching
# a real floor is a job for whoever first needs one.

[features]
# Off by default: a production build cannot read a policy from the environment.
# Enabling this compiles in the `IMAGELESS_POLICY_JSON` inline-policy path, whose
# trust anchor is the daemon environment rather than a file's ownership. Intended
# for local/dev hosts (e.g. the dev Docker harness), never for a shared node.
inline-policy = []
# Exports the resolver daemon and its socket wire protocol (`serve`,
# `handle_connection`, frame IO, `PROTOCOL_VERSION`). That surface versions on
# its own handshake, not on this crate's semver; only `imageless-resolver`
# should need it.
daemon = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
# Release-manifest signatures (SPEC §6.1): minisign's format, verified here
# rather than by shelling out, so a node needs no signing tool.
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = "2"
ureq = { workspace = true }

[dev-dependencies]
oci-spec = "0.7"
